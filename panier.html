<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier - PixelZone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins',sans-serif; background:#111; color:#fff; padding:2rem; }
h1 { color:#00bfff; text-align:center; margin-bottom:2rem; }
table { width:100%; border-collapse:collapse; background:rgba(25,25,30,0.9); border-radius:15px; overflow:hidden; margin-bottom:2rem; }
th,td { padding:1rem; text-align:center; border-bottom:1px solid #00bfff; }
th { background:rgba(0,191,255,0.2); }
input[type="number"], input[type="text"], input[type="tel"], textarea { width:90%; padding:0.5rem; margin:0.5rem auto; display:block; border-radius:10px; border:1px solid #00bfff; background:#1c1c22; color:#fff; }
button { background:#00bfff; color:#000; padding:0.5rem 1rem; border:none; border-radius:15px; cursor:pointer; margin-top:1rem; }
button:hover { background:#00ffcc; }
img.cart-img { width:50px; height:50px; object-fit:cover; border-radius:10px; margin-right:10px; vertical-align:middle; }
.actions-btns { display:flex; justify-content:center; gap:1rem; margin-bottom:2rem; }
a.continue-btn { padding:0.5rem 1.5rem; border-radius:20px; background:#00bfff; color:#000; font-weight:700; text-decoration:none; }
a.continue-btn:hover { background:#00ffcc; }
#total { font-size:1.5rem; color:#00ffcc; text-align:center; display:block; margin-bottom:2rem; }
.checkout-form { background:rgba(25,25,30,0.9); padding:2rem; border-radius:15px; max-width:600px; margin:2rem auto; }
.checkout-form h2 { text-align:center; color:#00bfff; margin-bottom:1rem; }
</style>
</head>
<body>

<h1>🛒 Mon Panier</h1>

<table id="cart-table">
  <thead>
    <tr>
      <th>Produit</th>
      <th>Prix (€)</th>
      <th>Quantité</th>
      <th>Subtotal (€)</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="actions-btns">
  <button onclick="clearCart()">Vider le panier</button>
  <a href="index.html" class="continue-btn">Continuer vos achats</a>
</div>

<h2 id="total">Total : 0 €</h2>

<div class="checkout-form">
  <h2>📝 Passer la commande</h2>
  <input type="text" id="firstName" placeholder="Prénom" required>
  <input type="text" id="lastName" placeholder="Nom" required>
  <textarea id="address" placeholder="Adresse de livraison" rows="3" required></textarea>
  <input type="tel" id="phone" placeholder="Numéro de téléphone" required>
  <button onclick="placeOrder()">Commander</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBmZ8oear75OdXjkjqn2p7k0VjotrQwRYQ",
  authDomain: "market-promo.firebaseapp.com",
  projectId: "market-promo",
  storageBucket: "market-promo.appspot.com",
  messagingSenderId: "381267030115",
  appId: "1:381267030115:web:dc310f4cb502bc81800856",
  measurementId: "G-0RQZLQ9GQ9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== PANIER =====
function renderCart(cart){
  const tbody = document.querySelector('#cart-table tbody');
  tbody.innerHTML = '';
  let total = 0;
  cart.forEach((item,index)=>{
    const subtotal = item.price*item.qty;
    total += subtotal;
    tbody.innerHTML += `
      <tr>
        <td><img src="${item.img}" class="cart-img" alt="${item.name}">${item.name}</td>
        <td>${item.price.toFixed(2)}</td>
        <td><input type="number" min="1" value="${item.qty}" onchange="updateQty(${index},this.value)"></td>
        <td>${subtotal.toFixed(2)}</td>
        <td><button onclick="removeItem(${index})">Supprimer</button></td>
      </tr>
    `;
  });
  document.getElementById('total').textContent = 'Total : ' + total.toFixed(2) + ' €';
}

function loadCart(){
  const user = auth.currentUser;
  if(user){
    db.collection('carts').doc(user.uid).get().then(doc=>{
      let cart = [];
      if(doc.exists) cart = doc.data().items;
      renderCart(cart);
    });
  } else {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    renderCart(cart);
  }
}

function saveCart(cart){
  const user = auth.currentUser;
  if(user){
    db.collection('carts').doc(user.uid).set({items:cart});
  } else {
    localStorage.setItem('cart', JSON.stringify(cart));
  }
}

function removeItem(index){
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  const user = auth.currentUser;
  if(user){
    db.collection('carts').doc(user.uid).get().then(doc=>{
      if(doc.exists) cart = doc.data().items;
      cart.splice(index,1);
      saveCart(cart);
      renderCart(cart);
    });
  } else {
    cart.splice(index,1);
    saveCart(cart);
    renderCart(cart);
  }
}

function updateQty(index,qty){
  qty = parseInt(qty);
  if(qty<1) qty=1;
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  const user = auth.currentUser;
  if(user){
    db.collection('carts').doc(user.uid).get().then(doc=>{
      if(doc.exists) cart = doc.data().items;
      cart[index].qty = qty;
      saveCart(cart);
      renderCart(cart);
    });
  } else {
    cart[index].qty = qty;
    saveCart(cart);
    renderCart(cart);
  }
}

function clearCart(){
  if(confirm("Voulez-vous vraiment vider le panier ?")){
    const user = auth.currentUser;
    if(user){
      db.collection('carts').doc(user.uid).set({items:[]});
    } else {
      localStorage.removeItem('cart');
    }
    renderCart([]);
  }
}

// ===== PASSER COMMANDE =====
function placeOrder(){
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const address = document.getElementById('address').value.trim();
  const phone = document.getElementById('phone').value.trim();
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  const user = auth.currentUser;

  if(user){
    db.collection('carts').doc(user.uid).get().then(doc=>{
      if(doc.exists) cart = doc.data().items;
      sendOrder(cart);
    });
  } else {
    sendOrder(cart);
  }

  function sendOrder(cart){
    if(cart.length===0){ alert("Votre panier est vide !"); return; }
    if(!firstName || !lastName || !address || !phone){ alert("Veuillez remplir tous les champs !"); return; }

    const order = {
      firstName, lastName, address, phone,
      cart, date:new Date().toISOString()
    };

    db.collection('orders').add(order)
      .then(()=>{
        alert("Commande passée avec succès !");
        clearCart();
        document.getElementById('firstName').value='';
        document.getElementById('lastName').value='';
        document.getElementById('address').value='';
        document.getElementById('phone').value='';
      })
      .catch(error=>{
        console.error(error);
        alert("Erreur lors de la commande. Réessayez.");
      });
  }
}

// ===== INIT =====
auth.onAuthStateChanged(loadCart);
</script>

</body>
</html>
