<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier - PixelZone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins',sans-serif; background:#111; color:#fff; padding:2rem; }
h1 { color:#00bfff; text-align:center; margin-bottom:2rem; }
table { width:100%; border-collapse:collapse; background:rgba(25,25,30,0.9); border-radius:15px; overflow:hidden; margin-bottom:2rem; }
th,td { padding:1rem; text-align:center; border-bottom:1px solid #00bfff; }
th { background:rgba(0,191,255,0.2); }
input[type="number"] { width:60px; text-align:center; background:#1c1c22; color:#fff; border-radius:10px; border:1px solid #00bfff; }
button { background:#00bfff; color:#000; padding:0.5rem 1rem; border:none; border-radius:15px; cursor:pointer; }
button:hover { background:#00ffcc; }
img.cart-img { width:50px; height:50px; object-fit:cover; border-radius:10px; margin-right:10px; vertical-align:middle; }
.actions-btns { display:flex; justify-content:center; gap:1rem; margin-bottom:2rem; }
a.continue-btn { padding:0.5rem 1.5rem; border-radius:20px; background:#00bfff; color:#000; font-weight:700; text-decoration:none; }
a.continue-btn:hover { background:#00ffcc; }
#total { font-size:1.5rem; color:#00ffcc; text-align:center; display:block; margin-bottom:2rem; }
</style>
</head>
<body>

<h1>🛒 Mon Panier</h1>

<table id="cart-table">
  <thead>
    <tr>
      <th>Produit</th>
      <th>Prix (€)</th>
      <th>Quantité</th>
      <th>Subtotal (€)</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="actions-btns">
  <button onclick="clearCart()">Vider le panier</button>
  <a href="index.html" class="continue-btn">Continuer vos achats</a>
</div>

<h2 id="total">Total : 0 €</h2>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBmZ8oear75OdXjkjqn2p7k0VjotrQwRYQ",
  authDomain: "market-promo.firebaseapp.com",
  projectId: "market-promo",
  storageBucket: "market-promo.appspot.com",
  messagingSenderId: "381267030115",
  appId: "1:381267030115:web:dc310f4cb502bc81800856",
  measurementId: "G-0RQZLQ9GQ9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function renderCart(cart){
  const tbody = document.querySelector('#cart-table tbody');
  tbody.innerHTML = '';
  let total = 0;
  cart.forEach((item,index)=>{
    const subtotal = item.price*item.qty;
    total += subtotal;
    tbody.innerHTML += `
      <tr>
        <td><img src="${item.img}" class="cart-img" alt="${item.name}">${item.name}</td>
        <td>${item.price.toFixed(2)}</td>
        <td><input type="number" min="1" value="${item.qty}" onchange="updateQty(${index},this.value)"></td>
        <td>${subtotal.toFixed(2)}</td>
        <td><button onclick="removeItem(${index})">Supprimer</button></td>
      </tr>
    `;
  });
  document.getElementById('total').textContent = 'Total : ' + total.toFixed(2) + ' €';
}

// ===== UTILISATEUR CONNECTÉ / LOCAL =====
function loadCart(){
  const user = auth.currentUser;
  if(user){
    const cartRef = db.collection('carts').doc(user.uid);
    cartRef.get().then(doc=>{
      let cart = [];
      if(doc.exists) cart = doc.data().items;
      renderCart(cart);
    });
  } else {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    renderCart(cart);
  }
}

function saveCart(cart){
  const user = auth.currentUser;
  if(user){
    db.collection('carts').doc(user.uid).set({items:cart});
  } else {
    localStorage.setItem('cart', JSON.stringify(cart));
  }
}

function removeItem(index){
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  const user = auth.currentUser;
  if(user){
    db.collection('carts').doc(user.uid).get().then(doc=>{
      if(doc.exists) cart = doc.data().items;
      cart.splice(index,1);
      saveCart(cart);
      renderCart(cart);
    });
  } else {
    cart.splice(index,1);
    saveCart(cart);
    renderCart(cart);
  }
}

function updateQty(index,qty){
  qty = parseInt(qty);
  if(qty<1) qty=1;
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  const user = auth.currentUser;
  if(user){
    db.collection('carts').doc(user.uid).get().then(doc=>{
      if(doc.exists) cart = doc.data().items;
      cart[index].qty = qty;
      saveCart(cart);
      renderCart(cart);
    });
  } else {
    cart[index].qty = qty;
    saveCart(cart);
    renderCart(cart);
  }
}

function clearCart(){
  if(confirm("Voulez-vous vraiment vider le panier ?")){
    const user = auth.currentUser;
    if(user){
      db.collection('carts').doc(user.uid).set({items:[]});
    } else {
      localStorage.removeItem('cart');
    }
    renderCart([]);
  }
}

// Charger le panier au démarrage
auth.onAuthStateChanged(loadCart);
</script>

</body>
</html>
