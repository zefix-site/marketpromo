<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - PixelZone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
  /* ===== BASE ===== */
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family:'Poppins', sans-serif;
    background:#f8f9fa;
    color:#2c3e50;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:1rem;
  }

  /* ===== HEADER ===== */
  .site-header { 
    background:#fff; 
    padding:1rem 3rem; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    border-bottom:1px solid #e8ecf1;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    position:fixed; 
    top:0; 
    left:0;
    right:0;
    z-index:1000;
  }
  .site-header h1 { 
    font-size:1.8rem; 
    font-weight:800; 
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    letter-spacing:-0.5px;
    cursor:pointer;
  }
  .site-header h1:hover { opacity:0.8; }
  .header-icons { display:flex; align-items:center; gap:1.5rem; }
  .header-icons a { 
    color:#2c3e50; 
    font-size:1.3rem; 
    transition:0.3s ease;
    text-decoration:none;
  }
  .header-icons a:hover { color:#667eea; }

  /* ===== LOGIN CONTAINER ===== */
  .auth-wrapper { 
    width:100%; 
    max-width:450px;
    margin-top:80px;
  }
  .auth-container {
    background:#fff;
    padding:3rem 2.5rem;
    border-radius:12px;
    border:1px solid #e8ecf1;
    box-shadow:0 2px 16px rgba(0,0,0,0.08);
  }
  .auth-header { 
    text-align:center; 
    margin-bottom:2.5rem;
  }
  .auth-header h1 { 
    font-size:2rem; 
    color:#2c3e50;
    font-weight:800;
    margin-bottom:0.5rem;
  }
  .auth-header p { 
    color:#7f8c8d; 
    font-size:0.95rem;
  }

  /* ===== FORM ===== */
  .form-group { 
    margin-bottom:1.5rem;
  }
  .form-group label { 
    display:block;
    margin-bottom:0.5rem;
    font-weight:600;
    color:#2c3e50;
    font-size:0.95rem;
  }
  .form-group input {
    width:100%;
    padding:0.9rem 1rem;
    border:1px solid #e0e0e0;
    border-radius:8px;
    font-family:inherit;
    font-size:0.95rem;
    color:#2c3e50;
    transition:0.3s;
  }
  .form-group input::placeholder { color:#bdc3c7; }
  .form-group input:focus { 
    outline:none;
    border-color:#667eea;
    box-shadow:0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  /* ===== BUTTON ===== */
  .login-btn { 
    width:100%;
    padding:1rem;
    background:linear-gradient(135deg, #667eea, #764ba2);
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 4px 12px rgba(102, 126, 234, 0.3);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .login-btn:hover { 
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(102, 126, 234, 0.4);
  }
  .login-btn:active { transform:translateY(0); }

  /* ===== LINKS ===== */
  .auth-footer { 
    text-align:center; 
    margin-top:2rem;
    padding-top:1.5rem;
    border-top:1px solid #e8ecf1;
  }
  .auth-footer p { 
    color:#7f8c8d; 
    font-size:0.95rem;
    margin-bottom:0.5rem;
  }
  .auth-link { 
    color:#667eea; 
    text-decoration:none;
    font-weight:700;
    transition:0.3s;
  }
  .auth-link:hover { color:#764ba2; }

  /* ===== RESPONSIVE ===== */
  @media (max-width:768px) {
    .site-header { padding:0.9rem 1.5rem; }
    .site-header h1 { font-size:1.4rem; }
    
    .auth-wrapper { margin-top:100px; }
    .auth-container { padding:2rem 1.5rem; }
    .auth-header h1 { font-size:1.8rem; }
  }

  @media (max-width:480px) {
    .site-header { padding:0.8rem 1rem; }
    .site-header h1 { font-size:1.2rem; }
    .header-icons { gap:1rem; }
    .header-icons a { font-size:1.1rem; }
    
    .auth-wrapper { margin-top:90px; width:95%; }
    .auth-container { padding:1.5rem 1rem; }
    .auth-header h1 { font-size:1.5rem; }
    .form-group input { padding:0.8rem 0.8rem; }
    .login-btn { padding:0.9rem; font-size:0.9rem; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1 onclick="window.location.href='index.html'">PixelZone</h1>
  <div class="header-icons">
    <a href="index.html" title="Accueil">
      <i class="fas fa-home"></i>
    </a>
  </div>
</header>

<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-header">
      <h1>Connexion</h1>
      <p>Connectez-vous à votre compte PixelZone</p>
    </div>
    
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="votre@email.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Votre mot de passe" required>
      </div>
      
      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt"></i> Se connecter
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Pas encore de compte ?</p>
      <a href="signup.html" class="auth-link">Créer un compte maintenant</a>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBmZ8oear75OdXjkjqn2p7k0VjotrQwRYQ",
  authDomain: "market-promo.firebaseapp.com",
  projectId: "market-promo",
  storageBucket: "market-promo.firebasestorage.app",
  messagingSenderId: "381267030115",
  appId: "1:381267030115:web:dc310f4cb502bc81800856",
  measurementId: "G-0RQZLQ9GQ9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function handleLogin(event){
  event.preventDefault();
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if(!email || !password){
    alert('Veuillez remplir tous les champs.');
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
  .then(userCredential => {
    const user = userCredential.user;
    db.collection('users').doc(user.uid).get()
      .then(doc => {
        if(doc.exists){
          const username = doc.data().name;
          localStorage.setItem('uid', user.uid);
          localStorage.setItem('username', username);
          alert('Connexion réussie !');
          window.location.href = 'index.html';
        } else {
          alert('Erreur : Utilisateur non trouvé.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('Erreur lors de la récupération du profil.');
      });
  })
  .catch(error => {
    alert('Erreur : ' + error.message);
  });
}
</script>

</body>
</html>
