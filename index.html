<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelZone - Gaming Store</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  /* ===== STYLES AMÉLIORÉS - BASE PROFESSIONNELLE ===== */
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { 
    font-family:'Poppins',sans-serif; 
    background:#f8f9fa;
    color:#2c3e50; 
    overflow-x:hidden;
  }

  /* HEADER - Navigation Premium */
  .site-header { 
    background:#fff; 
    padding:1rem 3rem; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    border-bottom:1px solid #e8ecf1;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    position:sticky; 
    top:0; 
    z-index:1000;
  }
  .site-header h1 { 
    font-size:1.8rem; 
    font-weight:800; 
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    letter-spacing:-0.5px;
  }
  .header-nav { display:flex; align-items:center; gap:2rem; }
  .search-bar { 
    display:flex; 
    align-items:center; 
    background:#f0f2f5; 
    border:1px solid #e0e0e0;
    border-radius:8px; 
    padding:0.6rem 1rem;
    transition:0.3s;
    min-width:250px;
  }
  .search-bar:focus-within { 
    background:#fff;
    border-color:#667eea;
    box-shadow:0 0 0 3px rgba(102, 126, 234, 0.1);
  }
  .search-bar input { 
    border:none; 
    background:none; 
    outline:none;
    flex:1;
    font-size:0.95rem;
  }
  .search-bar i { color:#999; }
  .header-icons { display:flex; align-items:center; gap:1.5rem; }
  .header-icons a { 
    color:#2c3e50; 
    font-size:1.3rem; 
    position:relative; 
    transition:0.3s ease;
    text-decoration:none;
  }
  .header-icons a:hover { color:#667eea; transform:scale(1.1); }
  .badge { 
    position:absolute; 
    top:-8px; 
    right:-8px; 
    background:#e74c3c; 
    color:#fff; 
    border-radius:50%; 
    width:20px; 
    height:20px; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-size:0.7rem;
  }

  .profile-dropdown { 
    position:relative; 
    display:inline-block;
  }
  .profile-dropdown::after {
    content:'';
    position:absolute;
    right:0;
    top:100%;
    width:100%;
    height:10px;
  }
  .profile-btn { 
    cursor:pointer; 
    font-size:1.3rem; 
    transition:0.3s ease;
    display:block;
  }
  .profile-btn:hover { color:#667eea; }
  .profile-dropdown-content { 
    display:none; 
    position:absolute; 
    right:0; 
    top:calc(100% + 10px);
    background:#fff; 
    min-width:260px; 
    border:1px solid #e8ecf1;
    border-radius:12px; 
    box-shadow:0 8px 24px rgba(0,0,0,0.12); 
    overflow:hidden; 
    z-index:2000;
    animation:dropdownSlideIn 0.2s ease;
  }
  @keyframes dropdownSlideIn {
    from {
      opacity:0;
      transform:translateY(-10px);
    }
    to {
      opacity:1;
      transform:translateY(0);
    }
  }
  .profile-header { 
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color:#fff; 
    padding:1.2rem 1.3rem;
    border-bottom:1px solid #e8ecf1;
  }
  .profile-header h3 { font-size:1.1rem; margin:0 0 0.3rem 0; }
  .profile-header p { font-size:0.85rem; opacity:0.9; margin:0; }
  .profile-dropdown-content a,
  .profile-dropdown-content button { 
    color:#2c3e50; 
    padding:0.95rem 1.3rem; 
    text-decoration:none; 
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    cursor:pointer;
    transition:0.2s; 
    border-bottom:1px solid #f0f2f5;
    font-family:inherit;
    font-size:0.95rem;
  }
  .profile-dropdown-content a:last-child,
  .profile-dropdown-content button:last-child { border:none; }
  .profile-dropdown-content a:hover,
  .profile-dropdown-content button:hover { 
    background:#f8f9fa;
    color:#667eea;
    padding-left:1.6rem;
  }
  .profile-dropdown:hover .profile-dropdown-content,
  .profile-dropdown-content:hover { 
    display:block !important; 
  }
  .logout-btn { color:#e74c3c; font-weight:600; }

  /* HERO - Section élégante */
  .hero { 
    position:relative; 
    text-align:center; 
    padding:8rem 2rem;
    color:#fff; 
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    overflow:hidden;
  }
  .hero::before { content:""; position:absolute; inset:0; background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.05)"/><circle cx="80" cy="80" r="30" fill="rgba(255,255,255,0.03)"/></svg>'); opacity:0.3; }
  .hero h2, .hero p { position:relative; z-index:2; }
  .hero h2 { 
    font-size:3rem; 
    font-weight:800; 
    margin-bottom:1rem;
    animation:slideUp 0.8s ease;
  }
  .hero p { 
    font-size:1.3rem; 
    opacity:0.95;
    animation:slideUp 0.8s ease 0.2s both;
  }
  @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }

  /* CATEGORIES - Design épuré */
  .product-categories { 
    width:90%; 
    margin:4rem auto; 
    text-align:center; 
  }
  .product-categories h2 { 
    font-size:2.2rem; 
    color:#2c3e50;
    margin-bottom:2.5rem; 
    font-weight:700;
  }
  .category-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: #fff;
    padding: 1rem;
    border-radius: 12px;
    border: 1px solid #e8ecf1;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .category-scroll {
    display: flex;
    gap: 0.8rem;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: #ddd #f0f2f5;
    flex: 1;
    padding:0.2rem;
  }
  .category-scroll::-webkit-scrollbar { height:6px; }
  .category-scroll::-webkit-scrollbar-track { background:#f0f2f5; border-radius:3px; }
  .category-scroll::-webkit-scrollbar-thumb { background:#d0d5dd; border-radius:3px; }
  .category-btn { 
    background:#f8f9fa; 
    border:2px solid #e0e0e0; 
    color:#2c3e50; 
    padding:0.7rem 1.5rem; 
    border-radius:25px; 
    font-size:0.95rem;
    cursor:pointer; 
    transition:all 0.3s ease; 
    white-space:nowrap;
    font-weight:600;
  }
  .category-btn:hover { 
    border-color:#667eea;
    color:#667eea;
    background:#f0f4ff;
  }
  .category-btn.active { 
    background:linear-gradient(135deg, #667eea, #764ba2);
    color:#fff; 
    border-color:#667eea;
    box-shadow:0 4px 12px rgba(102, 126, 234, 0.3);
  }
  .cat-arrow {
    background:#f0f2f5;
    border:none;
    color:#667eea;
    font-size:1rem;
    padding:0.5rem 0.7rem;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
  }
  .cat-arrow:hover {
    background:#667eea;
    color:#fff;
  }

  /* PRODUITS - Cards Premium */
  .popular-products { 
    width:90%; 
    margin:5rem auto; 
    text-align:center;
  }
  .popular-products h2 { 
    font-size:2.2rem; 
    color:#2c3e50;
    margin-bottom:2.5rem; 
    font-weight:700;
  }
  .product-grid { 
    display:grid; 
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); 
    gap:2rem; 
    justify-items:center;
  }
  .product-card { 
    position:relative; 
    background:#fff;
    border:1px solid #e8ecf1;
    border-radius:12px; 
    overflow:hidden; 
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    transition:all 0.35s ease; 
    cursor:pointer; 
    max-width:320px; 
    width:100%;
  }
  .product-card:hover { 
    transform:translateY(-8px);
    box-shadow:0 12px 24px rgba(0,0,0,0.12);
    border-color:#667eea;
  }
  .product-badge {
    position:absolute;
    top:12px;
    right:12px;
    background:linear-gradient(135deg, #667eea, #764ba2);
    color:#fff;
    padding:0.4rem 0.8rem;
    border-radius:20px;
    font-size:0.75rem;
    font-weight:700;
    z-index:10;
    text-transform:uppercase;
  }
  .product-card img { 
    width:100%; 
    height:250px; 
    object-fit:cover; 
    transition:transform 0.35s ease;
  }
  .product-card:hover img { transform:scale(1.08); }
  .product-info { 
    padding:1.5rem; 
    text-align:center; 
    position:relative;
  }
  .product-info h3 { 
    font-size:1.15rem; 
    font-weight:700; 
    color:#2c3e50;
    margin-bottom:0.5rem;
  }
  .product-info p { 
    font-size:0.95rem; 
    color:#7f8c8d;
    margin-bottom:0.4rem;
  }
  .product-price { 
    font-size:1.4rem; 
    font-weight:800; 
    color:#667eea;
    margin:0.8rem 0;
  }
  .buy-btn { 
    display:inline-flex; 
    align-items:center; 
    justify-content:center;
    gap:8px; 
    background:linear-gradient(135deg, #667eea, #764ba2); 
    color:#fff; 
    padding:0.8rem 1.8rem; 
    border-radius:8px; 
    font-weight:700; 
    font-size:0.9rem; 
    letter-spacing:0.3px; 
    text-transform:uppercase; 
    border:none;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(102, 126, 234, 0.3); 
    transition:all 0.3s ease; 
  }
  .buy-btn:hover { 
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(102, 126, 234, 0.4);
  }
  .buy-btn:active { transform:translateY(0); }

  /* LIGHTBOX - Improved */
  #lightbox { 
    display:none; 
    position:fixed; 
    inset:0; 
    background:rgba(0,0,0,0.85); 
    justify-content:center; 
    align-items:center; 
    z-index:2000; 
    backdrop-filter:blur(5px);
    animation:fadeIn 0.3s ease;
  }
  #lightbox img { 
    max-width:90%; 
    max-height:90%; 
    border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    transition:transform 0.3s ease; 
  }
  #lightbox img:hover { transform:scale(1.05); }
  #lightbox::after { 
    content:"✕"; 
    position:absolute; 
    top:30px; 
    right:50px; 
    font-size:2rem; 
    color:#fff; 
    cursor:pointer;
    transition:0.3s;
  }
  #lightbox::after:hover { transform:scale(1.2); }

  /* FOOTER - Clean & Professional */
  .site-footer { 
    text-align:center; 
    padding:3rem 2rem;
    background:#f8f9fa;
    border-top:1px solid #e8ecf1;
    color:#7f8c8d; 
    font-size:0.95rem;
  }
  /* =======================
     RESPONSIVE - TABLETTE
     ======================= */
  @media (max-width: 1024px) {
    .site-header { padding:0.9rem 1.5rem; }
    .site-header h1 { font-size:1.6rem; }
    .search-bar { min-width:180px; }
    .hero { padding:5rem 1.5rem; }
    .hero h2 { font-size:2.3rem; }
    .product-categories, .popular-products { width:95%; }
    .product-grid { grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:1.5rem; }
  }

  /* =======================
     RESPONSIVE - TÉLÉPHONE
     ======================= */
  @media (max-width: 768px) {
    .header-nav { display:none; }
    .site-header h1 { font-size:1.4rem; }
    .search-bar { display:none; }
    .hero { padding:4rem 1rem; }
    .hero h2 { font-size:2rem; }
    .hero p { font-size:1.1rem; }
    .product-grid { grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:1rem; }
    .product-card { max-width:100%; }
    .product-card img { height:180px; }
    .product-info { padding:1rem; }
    .product-info h3 { font-size:1rem; }
    .buy-btn { padding:0.7rem 1.2rem; font-size:0.8rem; }
  }

  /* =======================
     RESPONSIVE - PETIT MOBILE
     ======================= */
  @media (max-width: 480px) {
    .site-header { padding:0.8rem 1rem; }
    .site-header h1 { font-size:1.2rem; }
    .header-icons { gap:1rem; }
    .header-icons a { font-size:1.1rem; }
    .hero { padding:3rem 1rem; }
    .hero h2 { font-size:1.7rem; }
    .hero p { font-size:0.95rem; }
    .product-categories h2, .popular-products h2 { font-size:1.6rem; margin-bottom:1.5rem; }
    .product-grid { grid-template-columns:repeat(2, 1fr); gap:0.8rem; }
    .product-card { max-width:100%; }
    .product-card img { height:140px; }
    .product-info { padding:0.8rem; }
    .product-info h3 { font-size:0.9rem; }
    .product-info p { font-size:0.8rem; }
    .product-price { font-size:1.1rem; }
    .buy-btn { padding:0.6rem 1rem; font-size:0.7rem; }
  }




</style>
</head>
<body>

  <div class="category-bar">

      <button class="category-btn active" data-category="all">Tous les produits</button>
      <button class="category-btn" data-category="Bijouterie">Bijouterie</button>

      <button class="category-btn" data-category="Maquillage,soin">Maquillage & Beauté</button>
      <button class="category-btn" data-category="jouer">Jouets</button>
      <button class="category-btn" data-category="Informatique,Bureautique">Informatique</button>
      <button class="category-btn" data-category="électronique">Électronique</button>
      <button class="category-btn" data-category="électromenager">Électroménager</button>
      <button class="category-btn" data-category="Peluches">Peluches</button>
      <button class="category-btn" data-category="Parfums">Parfums</button>
      <button class="category-btn" data-category="Figurines">Figurines</button>
      <button class="category-btn" data-category="cuisines">Cuisine</button>
    </div>
    <button class="cat-arrow right" onclick="scrollCategories(200)">❯</button>
  </div>
</section>

<section class="popular-products">
  <h2>Nos Produits</h2>
  <div class="product-grid" id="product-grid">
    <!-- Les produits Firestore seront injectés ici -->
  </div>
</section>

<button class="lock-button" onclick="window.location.href='login cadena.html'">
  <i class="fas fa-lock"></i>
</button>

<footer class="site-footer">
  © 2026 PixelZone. Tous droits réservés.
</footer>

<div id="lightbox">
  <img src="" alt="Produit agrandi">
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>

<script>
// ===== CONFIGURATION FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBmZ8oear75OdXjkjqn2p7k0VjotrQwRYQ",
  authDomain: "market-promo.firebaseapp.com",
  projectId: "market-promo",
  storageBucket: "market-promo.appspot.com",
  messagingSenderId: "381267030115",
  appId: "1:381267030115:web:dc310f4cb502bc81800856",
  measurementId: "G-0RQZLQ9GQ9"
};
firebase.initializeApp(firebaseConfig);
firebase.analytics();
const auth = firebase.auth();
const db = firebase.firestore();

// ===== GESTION AUTH =====
auth.onAuthStateChanged(user => {
  const profileDropdown = document.getElementById("profile-dropdown-content");
  const loginLink = document.getElementById("login-link");
  const signupLink = document.getElementById("signup-link");
  updateCartCount();
  
  if(user) {
    // Récupérer le nom de l'utilisateur
    db.collection('users').doc(user.uid).get().then(doc => {
      if(doc.exists) {
        const userName = doc.data().name || user.email;
        updateProfileMenu(profileDropdown, userName, user.email, user.uid);
      } else {
        updateProfileMenu(profileDropdown, user.email, user.email, user.uid);
      }
    }).catch(err => {
      console.error("Erreur chargement profil:", err);
      updateProfileMenu(profileDropdown, user.email, user.email, user.uid);
    });
  } else {
    loginLink.textContent = "Se connecter";
    loginLink.href = "login.html";
    signupLink.style.display = "block";
  }
});

// ===== METTRE À JOUR LE MENU PROFIL =====
function updateProfileMenu(dropdown, name, email, uid) {
  dropdown.innerHTML = `
    <div class="profile-header">
      <h3>👤 ${name}</h3>
      <p>${email}</p>
    </div>
    <a href="profil.html"><i class="fas fa-user"></i> Mon Profil</a>
    <a href="mes-commandes.html"><i class="fas fa-shopping-history"></i> Mes Commandes</a>
    <a href="favoris.html"><i class="fas fa-heart"></i> Mes Favoris</a>
    <a href="parametres.html"><i class="fas fa-cog"></i> Paramètres</a>
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
  `;
}

// ===== DÉCONNEXION =====
function logout() {
  auth.signOut().then(() => {
    localStorage.removeItem('uid');
    localStorage.removeItem('username');
    window.location.href = 'index.html';
  }).catch(err => {
    console.error("Erreur déconnexion:", err);
    alert("Erreur lors de la déconnexion");
  });
}

// ===== PANIER - COUNTER =====
function updateCartCount() {
  const user = auth.currentUser;
  const cartCountBadge = document.getElementById("cart-count");
  
  if(user) {
    db.collection('carts').doc(user.uid).get().then(doc => {
      if(doc.exists) {
        const items = doc.data().items || [];
        const count = items.reduce((sum, item) => sum + item.qty, 0);
        if(count > 0) {
          cartCountBadge.textContent = count;
          cartCountBadge.style.display = 'flex';
        } else {
          cartCountBadge.style.display = 'none';
        }
      }
    }).catch(err => console.error("Erreur chargement panier:", err));
  } else {
    try {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      if(count > 0) {
        cartCountBadge.textContent = count;
        cartCountBadge.style.display = 'flex';
      } else {
        cartCountBadge.style.display = 'none';
      }
    } catch(e) {
      console.error("Erreur localStorage:", e);
    }
  }
}

// ===== PANIER =====
function addToCart(name, price, img){
  const user = auth.currentUser;
  const numericPrice = parseFloat(price);
  if(user){
    const cartRef = db.collection('carts').doc(user.uid);
    cartRef.get().then(doc=>{
      let cart = [];
      if(doc.exists) cart = doc.data().items || [];
      const existing = cart.find(item => item.name === name);
      if(existing){
        existing.qty +=1;
      } else {
        cart.push({name, price:numericPrice, img, qty:1});
      }
      cartRef.set({items:cart}).then(()=>{
        alert(name+" ajouté au panier !");
        updateCartCount();
      }).catch(err => console.error("Erreur sauvegarde:", err));
    }).catch(err => console.error("Erreur chargement:", err));
  } else {
    try {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item.name === name);
      if(existing){
        existing.qty +=1;
      } else {
        cart.push({name, price:numericPrice, img, qty:1});
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(name+" ajouté au panier !");
      updateCartCount();
    } catch(e) {
      console.error("Erreur localStorage:", e);
      alert("Erreur lors de l'ajout au panier");
    }
  }
}

// ===== RECHERCHE =====
const searchInput = document.getElementById('search-input');
if(searchInput) {
  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.product-card');
    cards.forEach(card => {
      const name = card.querySelector('h3').textContent.toLowerCase();
      const desc = card.querySelector('p').textContent.toLowerCase();
      if(name.includes(query) || desc.includes(query)) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    });
  });
}

// ===== LIGHTBOX =====
const lightbox = document.getElementById('lightbox');
function openLightbox(imgSrc) {
  lightbox.style.display = 'flex';
  lightbox.querySelector('img').src = imgSrc;
}
lightbox.addEventListener('click', () => { lightbox.style.display = 'none'; });

// ===== FILTRAGE CATÉGORIES =====
const categoryBtns = document.querySelectorAll('.category-btn');
const productGrid = document.querySelector('.product-grid');

categoryBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    categoryBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const category = btn.dataset.category;
    productGrid.querySelectorAll('.product-card').forEach(card => {
      card.style.display = (category === 'all' || card.dataset.category.includes(category)) ? 'block' : 'none';
    });
  });
});

function afficherProduit(data) {
  // 🔥 champs EXACTS venant de Firestore
  const name = data.name;
  const price = data.price;
  const category = data.category;
  const image = data.image; // base64 ou data:image/...
  const size = data.size;
  const weight = data.weight;
  const details = data.details;
  const description = data.description;
  // 🖼️ gestion image (admin + index identique)
  let imgSrc = image.startsWith("data:")
    ? image
    : "data:image/png;base64," + image;

  const div = document.createElement("div");
  div.classList.add("product-card");
  div.dataset.category = category;

  div.innerHTML = `
    <div style="position:relative;">
      <img src="${imgSrc}" alt="${name}">
      <span class="product-badge">Nouveau</span>
    </div>
    <div class="product-info">
      <h3>${name}</h3>
      <p>${description}</p>
      <p style="color:#999; font-size:0.85rem;">${size ? size + ' • ' : ''}${weight ? weight : ''}</p>
      <div class="product-price">${price}€</div>
      <button class="buy-btn">
        <i class="fas fa-shopping-cart"></i>
        Ajouter
      </button>
    </div>
  `;

  // 🛒 panier
  div.querySelector(".buy-btn").addEventListener("click", e => {
    e.preventDefault();
    addToCart(name, price, imgSrc);
  });

  // 🔍 lightbox
  div.querySelector("img").addEventListener("click", () => {
    openLightbox(imgSrc);
  });

  productGrid.appendChild(div);
}


// ===== Récupération produits Firestore =====
db.collection('products').onSnapshot(snapshot => {
  productGrid.innerHTML = ''; // Nettoyer avant affichage
  snapshot.forEach(doc => {
    afficherProduit(doc.data());
  });
});
// ===== SCROLL CATÉGORIES (TABLETTE / MOBILE) =====
function scrollCategories(value) {
  const container = document.getElementById("categoryScroll");
  container.scrollBy({
    left: value,
    behavior: "smooth"
  });
}
