<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelZone - Gaming Store</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  /* ===== STYLES EXISTANTS ===== */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Poppins',sans-serif; background:radial-gradient(circle at top left,#0a0a0a,#111,#000); color:#f5f5f5; overflow-x:hidden; scroll-behavior:smooth; }

  /* HEADER */
  .site-header { background:rgba(15,15,15,0.9); backdrop-filter:blur(15px); padding:1rem 3rem; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #d4af37; box-shadow:0 0 25px rgba(212,175,55,0.25); position:sticky; top:0; z-index:1000; animation:fadeDown 1s ease forwards; }
  @keyframes fadeDown { from { transform:translateY(-40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .site-header h1 { font-size:1.9rem; font-weight:900; color:#00bfff; letter-spacing:1px; text-shadow:0 0 12px rgba(212,175,55,0.7),0 0 20px rgba(255,215,0,0.4); }
  .header-icons { display:flex; align-items:center; gap:1.3rem; }
  .header-icons a { color:#d4af37; font-size:1.6rem; position:relative; transition:0.3s ease; }
  .header-icons a::after { content:""; position:absolute; width:0%; height:2px; bottom:-4px; left:0; background:#ffd700; transition:0.3s ease; }
  .header-icons a:hover::after { width:100%; }
  .header-icons a:hover { color:#fff2b0; transform:translateY(-2px); }

  .profile-dropdown { position:relative; display:inline-block; }
  .profile-dropdown-content { display:none; position:absolute; right:0; background:rgba(25,25,30,0.97); min-width:200px; border:1px solid #d4af37; border-radius:12px; box-shadow:0 0 20px rgba(212,175,55,0.25); overflow:hidden; }
  .profile-dropdown-content a { color:#fff; padding:0.9rem 1.2rem; text-decoration:none; display:block; border-bottom:1px solid rgba(0,191,255,0.3); transition:0.3s; }
  .profile-dropdown-content a:hover { background:linear-gradient(90deg,#d4af37,#ffef9f); color:#000; font-weight:600; }
  .profile-dropdown:hover .profile-dropdown-content { display:block; animation:fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

  /* HERO */
  .hero { position:relative; text-align:center; padding:6rem 2rem; color:#fff; background:url('https://cdn.pixabay.com/photo/2019/10/11/14/29/gaming-4547959_1280.jpg') center/cover no-repeat; }
  .hero::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,0.65); }
  .hero h2, .hero p { position:relative; z-index:2; }
  .hero h2 { font-size:3.2rem; font-weight:800; text-shadow:0 0 20px #00bfff; letter-spacing:2px; animation:glow 2s infinite alternate; }
  @keyframes glow { from { text-shadow:0 0 10px #00bfff; } to { text-shadow:0 0 25px #00ffcc,0 0 45px #00bfff; } }
  .hero p { font-size:1.2rem; margin-top:1rem; opacity:0.85; }

  /* CATEGORIES */
  .product-categories { width:90%; margin:4rem auto; text-align:center; }
  .product-categories h2 { font-size:2.3rem; color:#00bfff; margin-bottom:2rem; text-shadow:0 0 10px #00bfff; }
  .category-buttons { display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; }
  .category-btn { background:rgba(25,25,30,0.9); border:2px solid #00bfff; color:#00bfff; padding:0.7rem 1.6rem; border-radius:30px; font-size:1rem; cursor:pointer; transition:all 0.3s ease; box-shadow:0 0 10px rgba(0,191,255,0.2); }
  .category-btn:hover, .category-btn.active { background:linear-gradient(135deg,#00bfff,#00ffcc); color:#000; box-shadow:0 0 20px rgba(0,255,255,0.6); }

  /* PRODUITS */
  .popular-products { width:90%; margin:5rem auto; text-align:center; }
  .popular-products h2 { font-size:2.5rem; color:#00bfff; margin-bottom:2rem; text-shadow:0 0 10px #00bfff; }
  .product-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:1rem; justify-items:center; }
  .product-card { position:relative; background:linear-gradient(180deg, rgba(10,10,10,0.95) 0%, rgba(25,25,30,0.98) 100%); border:1.5px solid rgba(0,191,255,0.3); border-radius:8px; overflow:hidden; box-shadow:0 8px 20px rgba(0,255,255,0.08); transition:all 0.35s ease; cursor:pointer; max-width:320px; width:100%; }
  .product-card img { width:100%; height:250px; object-fit:cover; transition:transform 0.5s ease, filter 0.5s ease; border-bottom:1px solid rgba(0,191,255,0.4); }
  .product-card:hover img { transform:scale(1.05); filter:brightness(1.15) contrast(1.05); }
  .product-info { padding:1.3rem 1.4rem; text-align:center; position:relative; }
  .product-info h3 { font-size:1.15rem; font-weight:700; color:#f0f0f0; margin-bottom:0.5rem; text-shadow:0 0 10px rgba(0,255,255,0.2); }
  .product-info p { font-size:1.05rem; font-weight:600; color:#00ffcc; margin-bottom:1rem; }
  .buy-btn { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#00bfff,#00ffcc); color:#000; padding:0.7rem 1.6rem; border-radius:6px; font-weight:700; font-size:0.9rem; letter-spacing:0.5px; text-transform:uppercase; box-shadow:0 0 20px rgba(0,255,255,0.3); transition:all 0.3s ease; }
  .buy-btn:hover { transform:translateY(-3px) scale(1.05); box-shadow:0 0 25px rgba(0,255,255,0.6); }
  .buy-btn::before { content:"🛒"; font-size:1rem; }

  /* LIGHTBOX */
  #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:2000; backdrop-filter:blur(10px); animation:fadeIn 0.4s ease; }
  #lightbox img { max-width:90%; max-height:90%; border:3px solid #d4af37; border-radius:15px; box-shadow:0 0 40px rgba(212,175,55,0.4); transition:transform 0.3s ease; }
  #lightbox img:hover { transform:scale(1.05); }
  #lightbox::after { content:"✕"; position:absolute; top:30px; right:50px; font-size:2rem; color:#d4af37; cursor:pointer; text-shadow:0 0 15px rgba(212,175,55,0.6); transition:0.3s; }
  #lightbox::after:hover { color:#fff2b0; transform:scale(1.2); }

  /* FOOTER */
  .site-footer { text-align:center; padding:2rem; background:#0c0c10; border-top:2px solid #00bfff; color:#aaa; font-size:0.95rem; letter-spacing:0.5px; }
/* =======================
   RESPONSIVE TABLETTE
   ======================= */
@media (max-width: 1024px) {
  .product-categories {
    width: 100%;
    overflow-x: hidden;
  }

  .category-buttons {
    display: flex;
    gap: 0.7rem;
    padding: 0.5rem 1rem;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
  }
  .category-buttons::-webkit-scrollbar {
    display: none;
  }
  .category-btn {
    white-space: nowrap;
    padding: 0.65rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 8px;
    background: rgba(25,30,35,0.95);
    color: #cfefff;
    border: 1px solid rgba(0,191,255,0.3);
    transition: all 0.25s ease;
  }
  .category-btn:hover {
    background: rgba(0,191,255,0.15);
    color: #ffffff;
  }
  .category-btn.active {
    background: linear-gradient(135deg, #00bfff, #00ffcc);
    color: #000;
    border: none;
    box-shadow: 0 4px 14px rgba(0,255,255,0.5);
  }
  .category-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(15, 20, 25, 0.95);
    padding: 0.6rem;
    border-radius: 12px;
    border: 1px solid rgba(0,191,255,0.35);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .category-scroll {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    flex: 1;
  }
  .category-scroll::-webkit-scrollbar {
    display: none;
  }
  .cat-arrow {
    background: rgba(0,191,255,0.15);
    border: none;
    color: #00bfff;
    font-size: 1.1rem;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  .cat-arrow:hover {
    background: rgba(0,191,255,0.35);
    color: #fff;
  }
}
  .site-header {
    padding: 1rem 1.5rem;
  }

  .site-header h1 {
    font-size: 1.6rem;
  }

  .hero {
    padding: 4rem 1.5rem;
  }

  .hero h2 {
    font-size: 2.5rem;
  }

  .product-grid {
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }

  .product-card img {
    height: 220px;
  }





</style>
</head>
<body>

<header class="site-header">
  <h1>PixelZone</h1>
  <div class="header-icons">
    <a href="panier.html">🛒</a>
    <div class="profile-dropdown">
      <a href="#">👤</a>
      <div class="profile-dropdown-content" id="profile-dropdown-content">
        <a href="login.html" id="login-link">Se connecter</a>
        <a href="signup.html" id="signup-link">S'inscrire</a>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <h2>Bienvenue sur PixelZone</h2>
  <p>Découvrez nos produits gaming exclusifs et boostez votre setup !</p>
</section>

<section class="product-categories">
  <h2>🗂️ Catégories d'Articles</h2>
     <div class="category-bar">
    <button class="cat-arrow left" onclick="scrollCategories(-200)">❮</button>
   <div class="category-scroll" id="categoryScroll">
    <button class="category-btn active" data-category="all">Tout</button>
    <button class="category-btn" data-category="Bijouterie">Bijouterie</button>
    <button class="category-btn" data-category="vêtement">vêtement</button>
    <button class="category-btn" data-category="Maquillage,soin">Maquillage,bien-être</button>
    <button class="category-btn" data-category="jouer">jouer</button>
    <button class="category-btn" data-category="Informatique,Bureautique">Informatique,Bureautique</button>
    <button class="category-btn" data-category="électronique">électronique</button>
    <button class="category-btn" data-category="électromenager">électromenager</button>
    <button class="category-btn" data-category="Peluches">Peluches</button>
    <button class="category-btn" data-category="Parfums">Parfums</button>
    <button class="category-btn" data-category="Figurines">Figurines</button>
    <button class="category-btn" data-category="cuisines">cuisines</button>
  </div>
  <button class="cat-arrow right" onclick="scrollCategories(200)">❯</button>
</section>

<section class="popular-products">
  <h2>🔥 Produits Populaires</h2>
  <div class="product-grid" id="product-grid">
    <!-- Les produits Firestore seront injectés ici -->
  </div>
</section>

<button class="lock-button" onclick="window.location.href='login cadena.html'">
  <i class="fas fa-lock"></i>
</button>

<footer class="site-footer">
  © 2026 PixelZone. Tous droits réservés.
</footer>

<div id="lightbox">
  <img src="" alt="Produit agrandi">
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>

<script>
// ===== CONFIGURATION FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBmZ8oear75OdXjkjqn2p7k0VjotrQwRYQ",
  authDomain: "market-promo.firebaseapp.com",
  projectId: "market-promo",
  storageBucket: "market-promo.appspot.com",
  messagingSenderId: "381267030115",
  appId: "1:381267030115:web:dc310f4cb502bc81800856",
  measurementId: "G-0RQZLQ9GQ9"
};
firebase.initializeApp(firebaseConfig);
firebase.analytics();
const auth = firebase.auth();
const db = firebase.firestore();

// ===== GESTION AUTH =====
auth.onAuthStateChanged(user => {
  const loginLink = document.getElementById("login-link");
  const signupLink = document.getElementById("signup-link");
  if(user) {
    loginLink.textContent = "Profil";
    loginLink.href = "profil.html";
    signupLink.style.display = "none";
  } else {
    loginLink.textContent = "Se connecter";
    loginLink.href = "login.html";
    signupLink.style.display = "block";
  }
});

// ===== PANIER =====
function addToCart(name, price, img){
  const user = auth.currentUser;
  const numericPrice = parseFloat(price);
  if(user){
    const cartRef = db.collection('carts').doc(user.uid);
    cartRef.get().then(doc=>{
      let cart = [];
      if(doc.exists) cart = doc.data().items;
      const existing = cart.find(item => item.name === name);
      if(existing){
        existing.qty +=1;
      } else {
        cart.push({name, price:numericPrice, img, qty:1});
      }
      cartRef.set({items:cart}).then(()=>alert(name+" ajouté au panier !"));
    });
  } else {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const existing = cart.find(item => item.name === name);
    if(existing){
      existing.qty +=1;
    } else {
      cart.push({name, price:numericPrice, img, qty:1});
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    alert(name+" ajouté au panier !");
  }
}

// ===== LIGHTBOX =====
const lightbox = document.getElementById('lightbox');
function openLightbox(imgSrc) {
  lightbox.style.display = 'flex';
  lightbox.querySelector('img').src = imgSrc;
}
lightbox.addEventListener('click', () => { lightbox.style.display = 'none'; });

// ===== FILTRAGE CATÉGORIES =====
const categoryBtns = document.querySelectorAll('.category-btn');
const productGrid = document.querySelector('.product-grid');

categoryBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    categoryBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const category = btn.dataset.category;
    productGrid.querySelectorAll('.product-card').forEach(card => {
      card.style.display = (category === 'all' || card.dataset.category.includes(category)) ? 'block' : 'none';
    });
  });
});

function afficherProduit(data) {
  // 🔥 champs EXACTS venant de Firestore
  const name = data.name;
  const price = data.price;
  const category = data.category;
  const image = data.image; // base64 ou data:image/...
  const size = data.size;
  const weight = data.weight;
  const details = data.details;
  const description = data.description;
  // 🖼️ gestion image (admin + index identique)
  let imgSrc = image.startsWith("data:")
    ? image
    : "data:image/png;base64," + image;

  const div = document.createElement("div");
  div.classList.add("product-card");
  div.dataset.category = category;

  div.innerHTML = `
    <img src="${imgSrc}" alt="${name}">
    <div class="product-info">
      <h3>${name}</h3>
      <p>${price} €</p>
      <p>${size} </p>
      <p>${weight} </p>
      <p>${description} </p>
      <p>${details} </p>
      <a href="#" class="buy-btn">Ajouter au panier</a>
    </div>
  `;

  // 🛒 panier
  div.querySelector(".buy-btn").addEventListener("click", e => {
    e.preventDefault();
    addToCart(name, price,imgSrc);
  });

  // 🔍 lightbox
  div.querySelector("img").addEventListener("click", () => {
    lightbox.style.display = "flex";
    lightbox.querySelector("img").src = imgSrc;
  });

  productGrid.appendChild(div);
}


// ===== Récupération produits Firestore =====
db.collection('products').onSnapshot(snapshot => {
  productGrid.innerHTML = ''; // Nettoyer avant affichage
  snapshot.forEach(doc => {
    afficherProduit(doc.data());
  });
});
</script>


</body>
</html>
