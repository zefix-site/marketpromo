<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - PixelZone Gaming</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Orbitron', sans-serif; background: #0f0f1a; color: #eee; padding: 20px; }

h1 { text-align: center; margin-bottom: 30px; color: #00ffff; text-shadow: 0 0 8px #00ffff; }
h2 { margin-bottom: 15px; color: #ff00ff; text-shadow: 0 0 6px #ff00ff; }

/* FORM */
form {
  background: #1a1a2e;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
  max-width: 500px;
  margin: 0 auto 40px auto;
}

input, textarea, select, button {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #00ffff;
  background: #12122a;
  color: #eee;
}

button {
  background-color: #00ffff;
  color: #0f0f1a;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background-color: #ff00ff; color: #fff; }

/* PRODUITS */
.products {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.product-card {
  background: #1a1a2e;
  border-radius: 12px;
  width: 260px;
  padding: 15px;
  box-shadow: 0 0 15px rgba(0,255,255,0.3);
  position: relative;
  text-align: center;
}

.product-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
  border: 2px solid #00ffff;
}

.product-card h3 { color: #00ffff; margin-bottom: 5px; }
.product-card p { font-size: 13px; margin-bottom: 5px; }

.delete-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #ff007f;
  color: white;
  border: none;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
}

.quantity, .price-edit {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
}

.quantity button {
  padding: 5px 10px;
  font-weight: bold;
  background: #00ffff;
  border: none;
  border-radius: 6px;
}

.price-edit input {
  width: 80px;
  text-align: center;
}

.save-price {
  background: #00ffcc;
  border: none;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Admin - PixelZone Gaming</h1>

<form id="product-form">
  <h2>Ajouter un produit</h2>
  <input type="text" id="name" placeholder="Nom" required>
  <textarea id="description" placeholder="Description"></textarea>
  <input type="text" id="price" placeholder="Prix (€)" required>
  <input type="number" id="quantity" placeholder="Quantité" value="1">
  <input type="file" id="image" accept="image/*">
  <select id="category" required>
    <option value="">Catégorie</option>
    <option value="gaming">Gaming</option>
    <option value="informatique">Informatique</option>
  </select>
  <button type="submit">Ajouter</button>
</form>

<div class="products" id="products-container"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBmZ8oear75OdXjkjqn2p7k0VjotrQwRYQ",
  authDomain: "market-promo.firebaseapp.com",
  projectId: "market-promo"
});

const db = firebase.firestore();
const productsContainer = document.getElementById('products-container');
const form = document.getElementById('product-form');

function fileToBase64(file){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.readAsDataURL(file);
  });
}

/* AJOUT PRODUIT */
form.addEventListener('submit', async e=>{
  e.preventDefault();
  const img = document.getElementById('image').files[0];
  const base64 = img ? await fileToBase64(img) : "";

  await db.collection('products').add({
    name: name.value,
    description: description.value,
    price: price.value,
    quantity: Number(quantity.value),
    category: category.value,
    image: base64,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  form.reset();
  loadProducts();
});

/* LOAD PRODUITS */
async function loadProducts(){
  productsContainer.innerHTML = "";
  const snap = await db.collection('products').orderBy('createdAt','desc').get();

  snap.forEach(doc=>{
    const p = doc.data();
    const card = document.createElement('div');
    card.className = "product-card";

    card.innerHTML = `
      ${p.image ? `<img src="${p.image}">` : ""}
      <h3>${p.name}</h3>

      <div class="price-edit">
        <input type="text" value="${p.price}" class="price-input">
        <button class="save-price">💾</button>
      </div>

      <div class="quantity">
        <button class="dec">-</button>
        <span>${p.quantity||0}</span>
        <button class="inc">+</button>
      </div>

      <button class="delete-btn">✖</button>
    `;

    /* UPDATE PRIX */
    card.querySelector('.save-price').onclick = async ()=>{
      const newPrice = card.querySelector('.price-input').value;
      await db.collection('products').doc(doc.id).update({ price:newPrice });
      alert("Prix mis à jour");
    };

    /* QUANTITÉ */
    card.querySelector('.inc').onclick = async ()=>{
      await db.collection('products').doc(doc.id).update({ quantity:(p.quantity||0)+1 });
      loadProducts();
    };
    card.querySelector('.dec').onclick = async ()=>{
      await db.collection('products').doc(doc.id).update({ quantity:Math.max(0,(p.quantity||0)-1) });
      loadProducts();
    };

    /* SUPPRIMER */
    card.querySelector('.delete-btn').onclick = async ()=>{
      if(confirm("Supprimer ce produit ?")){
        await db.collection('products').doc(doc.id).delete();
        loadProducts();
      }
    };

    productsContainer.appendChild(card);
  });
}

loadProducts();
</script>
</body>
</html>
