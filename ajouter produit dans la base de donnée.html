<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - PixelZone Gaming</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Orbitron', sans-serif; background: #0f0f1a; color: #eee; padding: 20px; }

h1 { text-align: center; margin-bottom: 30px; color: #00ffff; text-shadow: 0 0 8px #00ffff; }
h2 { margin-bottom: 15px; color: #ff00ff; text-shadow: 0 0 6px #ff00ff; }

form {
  background: #1a1a2e;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
  max-width: 500px;
  margin: 0 auto 40px auto;
}

input, textarea, button, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #00ffff;
  background: #12122a;
  color: #eee;
}

button {
  background-color: #00ffff;
  color: #0f0f1a;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background-color: #ff00ff; color: #fff; }

.products {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.product-card {
  background: #1a1a2e;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,255,255,0.3);
  width: 240px;
  padding: 15px;
  position: relative;
  text-align: center;
}

.product-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
  border: 2px solid #00ffff;
}

.product-card h3 { color: #00ffff; margin-bottom: 5px; }
.product-card p { font-size: 13px; margin-bottom: 5px; }

.delete-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #ff007f;
  color: white;
  border: none;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
}

.quantity {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}

.quantity button {
  padding: 5px 10px;
  background: #00ffff;
  border: none;
  border-radius: 6px;
}

/* 🔧 MODIF PRIX */
.price-edit {
  display: flex;
  gap: 5px;
  justify-content: center;
  margin: 8px 0;
}
.price-edit input {
  width: 70px;
  text-align: center;
}
.price-edit button {
  padding: 5px 8px;
}
</style>
</head>

<body>

<h1>Admin - PixelZone Gaming</h1>

<!-- 🔒 FORMULAIRE STRICTEMENT INCHANGÉ -->
<form id="product-form">
  <h2>Ajouter un produit</h2>
  <input type="text" id="name" placeholder="Nom du produit" required>
  <textarea id="description" placeholder="Description du produit"></textarea>
  <input type="text" id="price" placeholder="Prix" required>
  <input type="text" id="size" placeholder="Taille (ex: 24 pouces)">
  <input type="text" id="weight" placeholder="Poids (ex: 3.5 kg)">
  <input type="file" id="image" accept="image/*">
  <textarea id="details" placeholder="Détails supplémentaires (texte libre)"></textarea>
  <input type="number" id="quantity" min="0" value="1" required>

  <label>Catégorie du produit</label>
  <select id="category" required>
    <option value="">-- Choisir une catégorie --</option>
    <option value="Informatique,Bureautique">Informatique & Bureautique</option>
    <option value="électronique">Électronique</option>
    <option value="électromenager">Électroménager</option>
    <option value="Maison,Jardin">Maison & Jardin</option>
    <option value="Figurines">Figurines</option>
    <option value="Parfums">Parfums</option>
    <option value="Peluches">Peluches</option>
    <option value="cuisines">cuisines</option>
  </select>

  <button type="submit">Ajouter le produit</button>
</form>

<div class="products" id="products-container"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBmZ8oear75OdXjkjqn2p7k0VjotrQwRYQ",
  authDomain: "market-promo.firebaseapp.com",
  projectId: "market-promo"
});

const db = firebase.firestore();
const form = document.getElementById('product-form');
const productsContainer = document.getElementById('products-container');

function fileToBase64(file){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// AJOUT PRODUIT (INCHANGÉ)
form.addEventListener('submit', async e=>{
  e.preventDefault();

  const imageFile = image.files[0];
  const imageBase64 = imageFile ? await fileToBase64(imageFile) : "";

  await db.collection('products').add({
    name: name.value,
    description: description.value,
    price: price.value,
    size: size.value,
    weight: weight.value,
    details: details.value,
    quantity: Number(quantity.value),
    category: category.value,
    image: imageBase64,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  form.reset();
  loadProducts();
});

// CHARGEMENT + MODIF PRIX
async function loadProducts(){
  productsContainer.innerHTML = "";
  const snap = await db.collection('products').orderBy('createdAt','desc').get();

  snap.forEach(doc=>{
    const p = doc.data();
    const card = document.createElement('div');
    card.className = "product-card";

    card.innerHTML = `
      ${p.image ? `<img src="${p.image}">` : ""}
      <h3>${p.name}</h3>
      <p>${p.description}</p>

      <!-- 🔧 MODIF PRIX -->
      <div class="price-edit">
        <input type="text" value="${p.price}">
        <button>💾</button>
      </div>

      <div class="quantity">
        <button>-</button>
        <span>${p.quantity || 0}</span>
        <button>+</button>
      </div>

      <button class="delete-btn">Supprimer</button>
    `;

    // 🔧 SAUVEGARDE PRIX
    card.querySelector('.price-edit button').onclick = async () => {
      const newPrice = card.querySelector('.price-edit input').value;
      await db.collection('products').doc(doc.id).update({ price: newPrice });
      alert("Prix mis à jour");
    };

    card.querySelector('.delete-btn').onclick = async () => {
      if(confirm("Supprimer ce produit ?")){
        await db.collection('products').doc(doc.id).delete();
        loadProducts();
      }
    };

    productsContainer.appendChild(card);
  });
}

loadProducts();
</script>

</body>
</html>
